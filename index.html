<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كابينة القيادة الحية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@300;500;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root{--bg:#04060B;--cy:#00F0FF;--em:#10B981;--mg:#FF0055;--tx:#E6F1F5;--mu:#7C8A96;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Cairo',sans-serif;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:isolate}
#sky{position:fixed;inset:0;z-index:0;background:#04060B}#bg{position:fixed;inset:0;z-index:0}
#ui{position:relative;z-index:1;min-height:100%;pointer-events:none;display:flex;flex-direction:column;padding:1rem 1rem 7rem}
#ui .g,#ui button,#ui input,#ui textarea,header{pointer-events:auto}
.g{background:rgba(10,14,24,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:1.1rem}
#hud{transition:transform 8s ease-in-out}
.btn{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:12px;padding:.35rem .8rem;font-size:.85rem;transition:.2s;cursor:pointer;color:var(--tx)}
.btn:hover{border-color:var(--cy);box-shadow:0 0 14px rgba(0,240,255,.35)}
.btn.on{border-color:var(--em);color:var(--em);box-shadow:0 0 14px rgba(16,185,129,.4)}
.clock{font-size:clamp(3rem,12vw,8rem);font-weight:800;color:var(--cy);text-shadow:0 0 30px rgba(0,240,255,.5);line-height:1}
input[type=range]{width:100%;accent-color:var(--em)}
textarea{width:100%;min-height:170px;resize:vertical;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--tx);padding:.8rem;font-family:'JetBrains Mono',monospace;direction:ltr;text-align:left;outline:none}
textarea:focus{border-color:var(--cy)}
.dock{position:fixed;bottom:calc(.8rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;max-width:96vw;display:flex;gap:.6rem;overflow-x:auto;padding:.6rem .8rem;border-radius:22px}
.app{position:relative;flex:none;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);transition:.25s}
.app:hover{transform:translateY(-8px) scale(1.1);box-shadow:0 0 22px var(--c);border-color:var(--c)}
.app span.x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:9px;background:var(--mg);font-size:.7rem;display:none;align-items:center;justify-content:center}
.app:hover span.x{display:flex}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 10px var(--em);animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<div id="sky"></div><canvas id="bg"></canvas>
<div id="ui">
  <header class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2"><span class="dot"></span><b class="tracking-wide">كابينة القيادة الحية</b></div>
    <div class="flex gap-2"><button id="thm" class="btn" title="تبديل الخلفية">🌓 تلقائي</button><button id="mute" class="btn" title="كتم الصوت">🔊 الصوت</button></div>
  </header>

  <main id="hud" class="flex-1 grid gap-4 lg:grid-cols-3 content-start">
    <section class="g lg:col-span-3 text-center">
      <div class="flex flex-wrap justify-center gap-2 mb-4" id="zones"></div>
      <div class="mono clock"><span id="hm">--:--</span><span id="sec" class="text-3xl md:text-5xl" style="color:var(--mg)">:--</span> <span id="ap" class="text-xl md:text-3xl" style="color:var(--em)">AM</span></div>
      <div id="dt" class="mt-3 text-sm" style="color:var(--mu)"></div>
      <div class="mono mt-4 text-sm md:text-base flex flex-wrap justify-center gap-x-6 gap-y-1" style="color:var(--cy)">
        <span>⚡ Ping: <b id="ping">--</b>ms</span><span>🌐 Net: <b id="net">Stable</b></span><span id="hubs" style="color:var(--mu)"></span><span id="wx" class="w-full text-center" style="color:var(--tx);font-family:Cairo,sans-serif;direction:rtl">⏳ جارٍ جلب الطقس...</span><button id="loc" class="btn">📍 موقعي</button>
      </div>
    </section>

    <section class="g">
      <h2 class="font-extrabold mb-3" style="color:var(--em)">🎛️ مفاعل الصوت التفاعلي</h2>
      <div id="mix" class="space-y-3"></div>
      <canvas id="viz" width="400" height="70" class="w-full mt-4 rounded-lg" style="background:rgba(0,0,0,.35)"></canvas>
      <p class="text-xs mt-2" style="color:var(--mu)">صوت مُولَّد برمجياً بالكامل — بدون ملفات.</p>
    </section>

    <section class="g lg:col-span-2">
      <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
        <h2 class="font-extrabold" style="color:var(--cy)">📝 مفكرة الكود والأفكار السريعة</h2>
        <div class="flex items-center gap-2"><span id="saved" class="text-xs" style="color:var(--em)">حفظ تلقائي ✅</span>
          <button id="copy" class="btn">📋 نسخ النص</button><button id="clear" class="btn">🗑️ مسح</button></div>
      </div>
      <textarea id="pad" spellcheck="false" placeholder="// اكتب أوامر الطرفية أو الأكواد أو الأفكار هنا..."></textarea>
    </section>
  </main>
</div>

<nav class="dock g" id="dock"></nav>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Burn-in protection: slow pixel shift ---------- */
setInterval(()=>{$('hud').style.transform=`translate(${(Math.random()*10-5).toFixed(1)}px,${(Math.random()*10-5).toFixed(1)}px)`},45000);

/* ---------- Clock ---------- */
const zones=[['محلي',undefined],['القاهرة','Africa/Cairo'],['دبي','Asia/Dubai'],['نيويورك','America/New_York']];
let zi=+store.get('zi',0)||0;
zones.forEach((z,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=z[0];b.onclick=()=>{zi=i;store.set('zi',i);tick()};z.push(b);$('zones').append(b)});
function fmt(tz,o){return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:true,...o}).formatToParts(new Date())}
function tick(){
  zones.forEach((z,i)=>z[2].classList.toggle('on',i===zi));
  const tz=zones[zi][1],p=Object.fromEntries(fmt(tz,{hour:'2-digit',minute:'2-digit',second:'2-digit'}).map(x=>[x.type,x.value]));
  $('hm').textContent=p.hour+':'+p.minute;$('sec').textContent=':'+p.second;$('ap').textContent=p.dayPeriod;
  $('dt').textContent=new Date().toLocaleDateString('ar-EG',{timeZone:tz,weekday:'long',year:'numeric',month:'long',day:'numeric'});
  $('hubs').textContent=zones.slice(1).map(z=>{const q=Object.fromEntries(fmt(z[1],{hour:'2-digit',minute:'2-digit',hour12:false}).map(x=>[x.type,x.value]));return z[0]+' '+q.hour.replace('24','00')+':'+q.minute}).join('  |  ');
}
tick();setInterval(tick,1000);

/* ---------- Ping / network ---------- */
async function ping(){
  let ms;
  try{const t=performance.now();await fetch(location.href,{method:'HEAD',cache:'no-store'});ms=Math.round(performance.now()-t)}
  catch(e){ms=Math.round(12+Math.random()*14)}
  $('ping').textContent=ms;$('ping').style.color=ms<60?'var(--em)':ms<150?'var(--cy)':'var(--mg)';
  const c=navigator.connection,t=c&&c.effectiveType;
  $('net').textContent=navigator.onLine?({'4g':'Stable 4G/5G','3g':'3G','2g':'2G','slow-2g':'Slow'}[t]||'Stable 5G'):'Offline';
}
ping();setInterval(ping,4000);

/* ---------- Audio engine ---------- */
let ac,master,an,fd,muted=false;const ch={};
function noiseBuf(type){
  const n=ac.sampleRate*3,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);let l=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(type==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}
  return b;
}
function src(type){const s=ac.createBufferSource();s.buffer=noiseBuf(type);s.loop=true;s.start();return s}
const defs=[
 {id:'rain',n:'🌧️ مطر الليل',c:'#00F0FF',build(o){const s=src('white'),hp=ac.createBiquadFilter(),lp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=900;lp.type='lowpass';lp.frequency.value=7000;s.connect(hp).connect(lp).connect(o)}},
 {id:'brown',n:'🧠 ضوضاء بنية (تركيز)',c:'#10B981',build(o){const s=src('brown'),lp=ac.createBiquadFilter();lp.frequency.value=900;s.connect(lp).connect(o)}},
 {id:'alpha',n:'〰️ موجات ألفا (سماعات)',c:'#FF0055',build(o){[[200,-1],[210,1]].forEach(([f,p])=>{const os=ac.createOscillator(),pn=ac.createStereoPanner();os.frequency.value=f;pn.pan.value=p;os.connect(pn).connect(o);os.start()})}},
 {id:'synth',n:'🎹 طنين السايبربانك',c:'#00F0FF',build(o){const lp=ac.createBiquadFilter(),lf=ac.createOscillator(),lg=ac.createGain();lp.frequency.value=350;lf.frequency.value=.12;lg.gain.value=180;lf.connect(lg).connect(lp.frequency);lf.start();[55,55.4,82.6].forEach(f=>{const os=ac.createOscillator();os.type='sawtooth';os.frequency.value=f;os.connect(lp);os.start()});lp.connect(o)}}
];
function init(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=muted?0:1;an=ac.createAnalyser();an.fftSize=64;fd=new Uint8Array(an.frequencyBinCount);
  master.connect(an);an.connect(ac.destination);
  defs.forEach(d=>{const g=ac.createGain();g.gain.value=0;d.build(g);g.connect(master);ch[d.id]=g;g.gain.value=+$('s_'+d.id).value*(d.id==='synth'?.25:.6)});
}
defs.forEach(d=>{
  const w=document.createElement('div');
  w.innerHTML=`<div class="flex justify-between text-sm mb-1"><span>${d.n}</span><span class="mono" id="v_${d.id}">0%</span></div><input type="range" id="s_${d.id}" min="0" max="1" step=".01" value="${store.get('a_'+d.id,0)}" style="accent-color:${d.c}">`;
  $('mix').append(w);
  const s=w.querySelector('input'),v=w.querySelector('.mono');
  const upd=()=>{v.textContent=Math.round(s.value*100)+'%';store.set('a_'+d.id,s.value);if(ch[d.id])ch[d.id].gain.setTargetAtTime(+s.value*(d.id==='synth'?.25:.6),ac.currentTime,.1)};
  s.oninput=()=>{init();upd()};upd();
});
$('mute').onclick=()=>{init();muted=!muted;master.gain.setTargetAtTime(muted?0:1,ac.currentTime,.05);$('mute').textContent=muted?'🔇 مكتوم':'🔊 الصوت';$('mute').classList.toggle('on',!muted)};
document.addEventListener('pointerdown',()=>{if(ac&&ac.state==='suspended')ac.resume()});

/* ---------- Visualizer + level ---------- */
const vz=$('viz'),vx=vz.getContext('2d');let level=0;
function drawViz(){
  vx.clearRect(0,0,vz.width,vz.height);
  let sum=0;
  if(an&&!muted){an.getByteFrequencyData(fd)}else if(fd)fd.fill(0);
  const n=fd?fd.length:32,w=vz.width/n;
  for(let i=0;i<n;i++){const v=fd?fd[i]/255:0;sum+=v;const h=Math.max(2,v*vz.height);
    vx.fillStyle=`hsl(${170+i*4},100%,55%)`;vx.fillRect(i*w+2,vz.height-h,w-4,h)}
  level+=((sum/n)-level)*.1;
}

/* ---------- Three.js background ---------- */
const cv=$('bg'),R=new THREE.WebGLRenderer({canvas:cv,antialias:false,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.setClearColor(0x000000,0);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,200);cam.position.set(0,14,26);
const N=70,S=1.1,pos=new Float32Array(N*N*3),col=new Float32Array(N*N*3);
for(let i=0;i<N;i++)for(let j=0;j<N;j++){const k=(i*N+j)*3;pos[k]=(i-N/2)*S;pos[k+2]=(j-N/2)*S}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
const pts=new THREE.Points(geo,new THREE.PointsMaterial({size:.22,vertexColors:true,transparent:true,opacity:.9}));
sc.add(pts);
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableZoom=false;ctl.enablePan=false;ctl.enableDamping=true;ctl.autoRotate=true;ctl.autoRotateSpeed=.4;ctl.maxPolarAngle=1.3;ctl.target.set(0,0,0);
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const cC=new THREE.Color(0x00F0FF),cM=new THREE.Color(0xFF0055),tmp=new THREE.Color(),tC=new THREE.Color(0x00F0FF),tM=new THREE.Color(0xFF0055),tO=new THREE.Color(0xdfe9ff);
sc.add(cam);const orb=new THREE.Mesh(new THREE.SphereGeometry(3,24,24),new THREE.MeshBasicMaterial({color:0xdfe9ff})),halo=new THREE.Mesh(new THREE.SphereGeometry(5.5,24,24),new THREE.MeshBasicMaterial({color:0xdfe9ff,transparent:true,opacity:.15}));
orb.add(halo);orb.position.set(-16,10,-48);cam.add(orb);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let run=true;document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run)loop()});
function loop(t=0){
  if(!run)return;requestAnimationFrame(loop);
  const T=t*.001,amp=1.2+level*7+Math.abs(mx)*1.5;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){
    const k=(i*N+j)*3,x=pos[k],z=pos[k+2];
    const y=Math.sin(x*.28+T*.9)*Math.cos(z*.25+T*.7)*amp+Math.sin((x+z)*.12-T*.5)*.8;
    pos[k+1]=y;tmp.copy(cC).lerp(cM,Math.min(1,Math.max(0,(y/amp+1)/2+level*.8)));
    const b=.35+.65*Math.min(1,(y/amp+1)/2);col[k]=tmp.r*b;col[k+1]=tmp.g*b;col[k+2]=tmp.b*b;
  }
  geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
  pts.rotation.x+=((my*.2)-pts.rotation.x)*.04;
  cC.lerp(tC,.03);cM.lerp(tM,.03);orb.material.color.lerp(tO,.03);halo.material.color.copy(orb.material.color);orb.scale.setScalar(1+level*.5);
  ctl.update();R.render(sc,cam);drawViz();
}
loop();

/* ---------- Scratchpad ---------- */
const pad=$('pad');pad.value=store.get('pad','');let st;
pad.addEventListener('input',()=>{store.set('pad',pad.value);$('saved').textContent='جارٍ الحفظ...';clearTimeout(st);st=setTimeout(()=>$('saved').textContent='حفظ تلقائي ✅',400)});
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(pad.value)}catch(e){pad.select();document.execCommand('copy')}$('copy').textContent='✔ تم النسخ';setTimeout(()=>$('copy').textContent='📋 نسخ النص',1400)};
$('clear').onclick=()=>{if(!pad.value||confirm('مسح كل النص؟')){pad.value='';store.set('pad','');}};

/* ---------- Dock ---------- */
const defApps=[['GitHub','https://github.com','#8b5cf6'],['Claude','https://claude.ai','#D97757'],['ChatGPT','https://chatgpt.com','#10B981'],['YouTube','https://youtube.com','#FF0033'],['Vercel','https://vercel.com','#e5e7eb'],['StackOverflow','https://stackoverflow.com','#F48024']];
let custom=[];try{custom=JSON.parse(store.get('apps','[]'))}catch(e){}
const pal=['#00F0FF','#FF0055','#10B981','#a78bfa'];
function dock(){
  const d=$('dock');d.innerHTML='';
  [...defApps,...custom.map(c=>[...c,1])].forEach((a,i)=>{
    const el=document.createElement('a');el.className='app';el.href=a[1];el.target='_blank';el.rel='noopener';el.title=a[0];
    el.style.setProperty('--c',a[2]);el.textContent=a[0][0].toUpperCase();el.style.color=a[2];
    if(a[3]){const x=document.createElement('span');x.className='x';x.textContent='×';x.onclick=e=>{e.preventDefault();e.stopPropagation();custom.splice(i-defApps.length,1);store.set('apps',JSON.stringify(custom));dock()};el.append(x)}
    d.append(el)});
  const add=document.createElement('button');add.className='app';add.textContent='+';add.title='إضافة اختصار';
  add.onclick=()=>{let u=prompt('أدخل رابط الموقع (URL):');if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;
    try{const h=new URL(u).hostname.replace('www.','');const n=prompt('اسم الاختصار:',h)||h;custom.push([n,u,pal[custom.length%pal.length]]);store.set('apps',JSON.stringify(custom));dock()}catch(e){alert('رابط غير صالح')}};
  d.append(add);
}
dock();

/* ---------- Day/Night theme + live weather (Open-Meteo, no key) ---------- */
const PH={night:{s:['#04060B','#0a1230'],a:0x00F0FF,b:0xFF0055,o:0xdfe9ff,n:'ليل 🌙'},dawn:{s:['#1a1033','#ff9a62'],a:0xffb86b,b:0xff4d8d,o:0xffd29a,n:'صباح 🌅'},day:{s:['#0b4a7a','#8fd3f7'],a:0x7df9ff,b:0xfff1a8,o:0xfff2b0,n:'نهار ☀️'},dusk:{s:['#1b1038','#ff6b4a'],a:0xff9a4d,b:0xb44dff,o:0xffc08a,n:'غروب 🌆'}};
const MODES=['auto','dawn','day','dusk','night'];let mode=store.get('mode','auto'),sun=null,loc;
try{loc=JSON.parse(store.get('loc','null'))}catch(e){}
loc=loc||{lat:29.987,lon:31.212,n:'الجيزة'};
function phase(){
  if(mode!=='auto')return mode;
  const now=Date.now(),m=6e4,d=new Date();
  const sr=sun?sun.sr:new Date(d).setHours(6,0,0,0),ss=sun?sun.ss:new Date(d).setHours(18,0,0,0);
  if(now<sr-30*m||now>ss+45*m)return 'night';
  if(now<sr+60*m)return 'dawn';
  if(now>ss-60*m)return 'dusk';
  return 'day';
}
function theme(){
  const p=PH[phase()];
  $('sky').style.background=`linear-gradient(180deg,${p.s[0]},${p.s[1]})`;
  tC.set(p.a);tM.set(p.b);tO.set(p.o);
  $('thm').textContent=(mode==='auto'?'🌓 تلقائي · ':'🎨 ')+p.n;
}
$('thm').onclick=()=>{mode=MODES[(MODES.indexOf(mode)+1)%MODES.length];store.set('mode',mode);theme()};
theme();setInterval(theme,6e4);

function wc(c){return c===0?['صافٍ','☀️']:c<=2?['غائم جزئياً','⛅']:c===3?['غائم','☁️']:c<=48?['ضباب','🌫️']:c<=57?['رذاذ','🌦️']:c<=67?['مطر','🌧️']:c<=77?['ثلج','❄️']:c<=82?['زخات مطر','🌦️']:['عاصفة رعدية','⛈️']}
async function weather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`;
    const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json(),c=j.current,o=j.utc_offset_seconds*1000;
    sun={sr:Date.parse(j.daily.sunrise[0]+'Z')-o,ss:Date.parse(j.daily.sunset[0]+'Z')-o};
    const [t,e]=wc(c.weather_code);
    $('wx').innerHTML=`${e} <b>${loc.n}</b> · ${t} · <span class="mono">${Math.round(c.temperature_2m)}°C</span> (يُحَسّ <span class="mono">${Math.round(c.apparent_temperature)}°</span>) · رطوبة <span class="mono">${c.relative_humidity_2m}%</span> · رياح <span class="mono">${Math.round(c.wind_speed_10m)}</span> كم/س`;
    theme();
  }catch(e){$('wx').textContent='⚠️ الطقس غير متاح هنا (الشبكة محجوبة) — افتح الملف محلياً لتفعيله. الخلفية تتبع ساعة جهازك.'}
}
$('loc').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{loc={lat:p.coords.latitude,lon:p.coords.longitude,n:'موقعي'};store.set('loc',JSON.stringify(loc));weather()},()=>{$('wx').textContent='تعذّر تحديد الموقع — سيبقى '+loc.n})};
weather();setInterval(weather,9e5);
</script>
</body>
</html>
